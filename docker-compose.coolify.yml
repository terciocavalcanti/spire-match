# Compose de produção para deploy via Coolify (não para `docker compose up`
# manual — para isso use infrastructure/docker/docker-compose.prod.yml).
#
# Diferenças em relação ao docker-compose.prod.yml:
# - Sem serviço "caddy": o próprio Coolify já roda um proxy reverso com HTTPS
#   automático (Let's Encrypt) e assume as portas 80/443 do host.
# - "build:" em vez de "image:": o Coolify clona o repositório e builda cada
#   Dockerfile diretamente, sem depender do GitHub Actions/GHCR.
# - Toda variável "${NOME}" aqui vira um campo editável na aba "Environment
#   Variables" deste recurso na UI do Coolify (ver docs/deployment/DEPLOY_COOLIFY.md).
#
# Nenhum serviço publica "ports": o Coolify conecta no proxy pelo nome do
# serviço/porta interna, atribuído na aba "Domains" da UI.

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - spire_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - spire_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_COOKIE_NAME: spire_session
      SESSION_TTL_DAYS: 30
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Pendências externas reais — deixe em branco até ter a credencial
      # (ver docs/deployment/DEPLOY_COOLIFY.md).
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      SMTP_URL: ${SMTP_URL:-}
      WHATSAPP_CLOUD_API_TOKEN: ${WHATSAPP_CLOUD_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      LLM_PROVIDER_API_KEY: ${LLM_PROVIDER_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY:-}
    restart: unless-stopped
    environment:
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/admin.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      PORT: 3001
    depends_on:
      api:
        condition: service_healthy

volumes:
  spire_postgres_data:
  spire_redis_data:
