name: Build e Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test e build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_MAPTILER_API_KEY: ${{ vars.NEXT_PUBLIC_MAPTILER_API_KEY }}
        run: pnpm turbo run typecheck lint test build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: infrastructure/docker/api.Dockerfile
          - app: web
            dockerfile: infrastructure/docker/web.Dockerfile
          - app: admin
            dockerfile: infrastructure/docker/admin.Dockerfile
          - app: worker
            dockerfile: infrastructure/docker/worker.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem (${{ matrix.app }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_MAPTILER_API_KEY=${{ vars.NEXT_PUBLIC_MAPTILER_API_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/spire-match-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/spire-match-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Conectar via SSH e atualizar a VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/spire-match
            git pull --ff-only
            docker compose --env-file .env -f infrastructure/docker/docker-compose.prod.yml pull
            docker compose --env-file .env -f infrastructure/docker/docker-compose.prod.yml up -d
            docker image prune -f
